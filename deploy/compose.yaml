# friday dash as a service on the master. `friday dash up` runs this with GH_TOKEN set from
# `gh auth token`; `friday dash down` stops it.
#
#   GH_TOKEN=... docker compose -f deploy/compose.yaml up -d --build
#
# network_mode: host so the dash can bind the host's tailnet IP and sees real peer addresses
# (the whois sender check depends on that). No secret lives in this file: GH_TOKEN is passed
# through from the environment, and the registry and tailscaled socket are mounted read-only.
services:
  friday-dash:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: friday-dash:local
    network_mode: host
    restart: unless-stopped
    environment:
      - GH_TOKEN
    volumes:
      - ${HOME}/.config/friday/nodes.toml:/home/friday/.config/friday/nodes.toml:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - dash-state:/home/friday/.local/state/friday/dash

volumes:
  dash-state:
